spring.application.name=demo

# Connection settings come from environment variables, never from this file.
# DB_USER and DB_PASSWORD have no default on purpose.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_library}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# schema.sql owns the database structure; JPA must not create or change tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
